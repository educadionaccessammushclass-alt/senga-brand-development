<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080808">
  <meta name="description" content="SENGA – Daktari wa Kutibu Stress. Official Senga Brand Development Platform.">

  <title>SENGA | Daktari wa Kutibu Stress</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 500px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      isolation: isolate;
      background: #080808;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.20) 0%,
          rgba(0,0,0,0.10) 35%,
          rgba(0,0,0,0.58) 75%,
          rgba(0,0,0,0.82) 100%
        );
    }

    .branding {
      width: 100%;
      padding: 30px 20px;
      color: #ffffff;
      margin-top: 24vh;
      animation: appear 1.2s ease-out;
    }

    .brand-name {
      font-size: clamp(55px, 12vw, 125px);
      font-weight: 900;
      letter-spacing: 0.12em;
      line-height: 1;
      text-shadow: 0 5px 25px rgba(0,0,0,0.75);
    }

    .brand-line {
      width: 85px;
      height: 4px;
      background: #d6ad55;
      margin: 25px auto;
    }

    .brand-tagline {
      font-size: clamp(17px, 3.5vw, 32px);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 3px 12px rgba(0,0,0,0.95);
    }

    .footer {
      position: absolute;
      bottom: 25px;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 10px;
      color: rgba(255,255,255,0.75);
      font-size: 11px;
      letter-spacing: 2px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .hero-image {
        object-position: center center;
      }

      .branding {
        margin-top: 30vh;
      }

      .brand-name {
        letter-spacing: 0.09em;
      }

      .brand-tagline {
        letter-spacing: 0.035em;
      }
    }

    @media (max-height: 550px) {
      .branding {
        margin-top: 12vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .branding {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <!-- Exact photograph supplied by the owner -->
    <img
      class="hero-image"
      src="https://www.mwanaspoti.co.tz/resource/image/3192168/landscape_ratio16x9/1600/900/2e46a76b955145cd7d37e052a8139c66/KR/senga-pic.jpg"
      alt="Senga"
      fetchpriority="high"
    >

    <div class="overlay"></div>

    <section class="branding">
      <h1 class="brand-name">SENGA</h1>

      <div class="brand-line"></div>

      <p class="brand-tagline">
        Daktari wa Kutibu Stress
      </p>
    </section>

    <footer class="footer">
      SENGA OFFICIAL BRAND DEVELOPMENT
    </footer>

  </main>

</body>
</html>
